name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing happens by pushing the built bundle to the gh-pages branch, so
# the only permission needed is write access to the repository contents.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build static bundle
        env:
          STATIC_EXPORT: "true"
          # Project pages are served from /<repo>, so the app needs that prefix.
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Publish to gh-pages
        run: |
          touch out/.nojekyll
          cd out
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Static build of ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
